name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --test test/*.test.js
      - name: CLI smoke test
        run: |
          node bin/cleaner.js --version
          node bin/cleaner.js --help

  desktop:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: node scripts/sync-core.mjs
      - run: npm run typecheck
      - name: End-to-end tests of the real app (demo data and an empty real profile)
        run: npm run e2e
